# Minimal static-site config -- six flat HTML pages, no routing tricks
# needed. Coolify/Traefik in front of this handles HTTPS/Let's Encrypt and
# the domain, same as the GSS app itself; this only needs to serve files
# correctly on the port Traefik forwards to (80).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't ship build/source files that happen to be in the repo -- only
    # the site itself should ever be reachable.
    location ~ /(Dockerfile|nginx\.conf|build\.py|generate\.py|pages_.*\.py)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Static assets can be cached aggressively; the HTML pages themselves
    # are small and change rarely enough that the browser default is fine.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
