{% extends "base.html" %}
{% block title %}New Pipeline Template{% endblock %}
{% block content %}
<h1 class="h4 mb-4">New Pipeline Template</h1>
<form method="post" class="card shadow-sm border-0" style="max-width: 560px;">
  <div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Template Name <span class="text-danger">*</span></label>
      <input class="form-control" name="template_name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Win Criteria</label>
      <textarea class="form-control" name="win_criteria_prompt" rows="2" placeholder="What does 'won' look like for this template?"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Disqualify After (days)</label>
      <input type="number" min="1" class="form-control" name="disqualify_after_days" style="max-width: 160px;">
      <div class="form-text">Default staleness threshold — an Opportunity can override its own.</div>
    </div>
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a href="{{ url_for('client_acquisition.list_templates') }}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary" type="submit">Create — then add stages</button>
  </div>
</form>
{% endblock %}
